<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — MC Dashboard</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="wrap narrow">
<h1>MC Dashboard</h1>
{% if no_password %}<p class="err">No admin password set yet. On the host run:<br><code>.venv/bin/python cli.py set-password</code></p>{% endif %}
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<label>Admin password<br><input type="password" name="password" autofocus autocomplete="current-password"></label><br>
<button type="submit">Log in</button>
</form>
</main></body></html>
