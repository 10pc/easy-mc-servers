<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>bleh</title><link rel="stylesheet" href="/static/style.css">
<meta name="csrf-token" content="{{ csrf_token }}"></head>
<body><main class="wrap">
<header class="top"><h1>bleh</h1>
<span>hi, {{ username }}{% if is_admin %} (admin){% endif %}</span>
<form method="post" action="/logout" id="logoutForm"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit">logout</button></form>
</header>
<p class="hint">hai :wave:<br>servers are listed here :3</p>
<div id="servers"></div>
<h2>logs</h2>
<select id="logSel"></select> <button id="logBtn">refresh logs</button>
<pre id="logs">select a server…</pre>
<div class="row" style="margin-top:8px">
<input id="consoleIn" placeholder="type a command…" autocomplete="off" spellcheck="false" style="flex:1;min-width:200px">
<button id="consoleSend">send</button>
</div>
<h2>account</h2>
<div class="card">
<div class="row">
<input id="curPass" type="password" placeholder="current password" autocomplete="current-password" style="width:160px">
<input id="newPass1" type="password" placeholder="new password" autocomplete="new-password" style="width:160px">
<input id="newPass2" type="password" placeholder="confirm new password" autocomplete="new-password" style="width:160px">
<button id="changePassBtn">change password</button>
</div>
</div>
{% if is_admin %}
<h2>users (admin only)</h2>
<div class="card">
<div class="row">
<input id="newUser" placeholder="username" autocomplete="off" style="width:130px">
<input id="newPass" type="password" placeholder="password" autocomplete="new-password" style="width:150px">
<label><input type="checkbox" id="newAdmin"> admin</label>
<button id="addUserBtn">add user</button>
</div>
<div id="userList"></div>
</div>
{% endif %}
<script src="/static/app.js"></script>
</main></body></html>
